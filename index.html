<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الإدارة اللوجستية والحسابات الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
        }
        .glass-header { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-900 font-sans text-slate-100 min-h-screen flex flex-col">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full space-y-6 shadow-2xl">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-2xl font-black text-white">تسجيل الدخول الآمن</h2>
                <p class="text-xs text-slate-400">منظومة الحسابات والعمليات اللوجستية</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">اسم المستخدم</label>
                    <input type="text" id="login-username" value="raad" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">كلمة المرور</label>
                    <input type="password" id="login-password" value="737125" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-blue-600/30 transition">
                    دخول المنظومة
                </button>
            </form>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="main-app" class="hidden flex-1 flex flex-col">
        <header class="glass-header text-white px-4 py-3 sticky top-0 z-40 border-b border-slate-800 no-print">
            <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 p-2.5 rounded-xl text-xl text-white shadow-lg">
                        <i class="fa-solid fa-truck-fast"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-black tracking-wide">لوحة التحكم اللوجستية الذكية</h1>
                        <span class="text-xs text-blue-400 font-medium">المدير العام</span>
                    </div>
                </div>

                <div class="flex items-center gap-2 flex-wrap">
                    <button onclick="openModal('modal-add-entry')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg">
                        <i class="fa-solid fa-plus"></i> إضافة عملية يدوية
                    </button>
                    <button onclick="exportToExcel()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                        <i class="fa-solid fa-file-excel text-emerald-400"></i> تصدير Excel
                    </button>
                    <button onclick="shareWhatsApp()" class="bg-emerald-800 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                        <i class="fa-brands fa-whatsapp"></i> مشاركة
                    </button>
                    <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                        <i class="fa-solid fa-print"></i> طباعة
                    </button>
                    <button onclick="openTrashModal()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                        <i class="fa-solid fa-trash-arrow-up"></i> سلة المهملات
                    </button>
                    <button onclick="handleLogout()" class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-3 py-2 rounded-xl text-xs font-medium">
                        خروج
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl w-full mx-auto p-4 space-y-6 flex-1">
            <!-- شريط البحث والتصفية -->
            <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-2xl space-y-3 no-print">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">بحث سريع</label>
                        <input type="text" id="search-query" onkeyup="renderCurrentTab()" placeholder="ابحث في الجدول الحالي..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">التصفية بالشهر والسنة</label>
                        <input type="month" id="filter-month" onchange="renderCurrentTab()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none">
                    </div>
                    <div class="flex items-end">
                        <button onclick="resetFilters()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold p-2.5 rounded-xl">إعادة ضبط الفلترة</button>
                    </div>
                </div>
            </div>

            <!-- الجداول السبعة (Tabs) -->
            <div class="flex border-b border-slate-800 gap-1 overflow-x-auto text-xs font-bold no-print">
                <button onclick="switchTab('trips')" id="tab-trips" class="tab-btn px-4 py-3 border-b-2 border-blue-500 text-blue-400 whitespace-nowrap">1. الرحلات</button>
                <button onclick="switchTab('draws')" id="tab-draws" class="tab-btn px-4 py-3 border-b-2 border-transparent text-slate-400 whitespace-nowrap">2. سحبيات السائقين/العمال</button>
                <button onclick="switchTab('maintenance')" id="tab-maintenance" class="tab-btn px-4 py-3 border-b-2 border-transparent text-slate-400 whitespace-nowrap">3. الصيانة</button>
                <button onclick="switchTab('rentals')" id="tab-rentals" class="tab-btn px-4 py-3 border-b-2 border-transparent text-slate-400 whitespace-nowrap">4. الشركات المستأجرة</button>
                <button onclick="switchTab('debts')" id="tab-debts" class="tab-btn px-4 py-3 border-b-2 border-transparent text-slate-400 whitespace-nowrap">5. الديون</button>
                <button onclick="switchTab('expenses')" id="tab-expenses" class="tab-btn px-4 py-3 border-b-2 border-transparent text-slate-400 whitespace-nowrap">6. المصروفات</button>
                <button onclick="switchTab('invoices')" id="tab-invoices" class="tab-btn px-4 py-3 border-b-2 border-transparent text-slate-400 whitespace-nowrap">7. الفواتير</button>
            </div>

            <!-- عرض الجدول -->
            <div class="bg-slate-800/85 border border-slate-700/60 rounded-2xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table id="data-table" class="w-full text-right text-xs">
                        <thead id="table-head" class="bg-slate-900 border-b border-slate-700 text-slate-300 font-bold"></thead>
                        <tbody id="table-body" class="divide-y divide-slate-700/50 text-slate-200"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- نافذة الإدخال اليدوي -->
    <div id="modal-add-entry" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-white text-sm">إضافة عملية يدوية جديدة</h3>
                <button onclick="closeModal('modal-add-entry')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="entry-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">اختر القسم المستهدف *</label>
                    <select id="form-target-table" onchange="buildDynamicFormFields(this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none">
                        <option value="trips">1. رحلة جديدة</option>
                        <option value="draws">2. سحب سائق / عامل</option>
                        <option value="maintenance">3. صيانة</option>
                        <option value="rentals">4. شركة مستأجرة</option>
                        <option value="debts">5. دين / التزام</option>
                        <option value="expenses">6. مصروفات عامة</option>
                        <option value="invoices">7. فاتورة</option>
                    </select>
                </div>
                <div id="dynamic-fields-container" class="space-y-3"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg transition">حفظ السجل</button>
            </form>
        </div>
    </div>

    <!-- نافذة سلة المهملات -->
    <div id="modal-trash" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 space-y-4 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-amber-400 text-sm"><i class="fa-solid fa-trash-arrow-up"></i> سلة المهملات (استرجاع البيانات المحذوفة)</h3>
                <button onclick="closeModal('modal-trash')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="trash-list" class="space-y-2 text-xs"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fdvewnybywmxmbjmnlgt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Xr6Qm3QS7h8K-5P9dLjDUQ_uHF4CTgD';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let activeTab = 'trips';
        let store = { trips:[], draws:[], maintenance:[], rentals:[], debts:[], expenses:[], invoices:[] };

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('sys_logged')) showMainApp();
            buildDynamicFormFields('trips');
        });

        function handleLogin(e) {
            e.preventDefault();
            localStorage.setItem('sys_logged', 'true');
            showMainApp();
        }

        function handleLogout() {
            localStorage.removeItem('sys_logged');
            location.reload();
        }

        async function showMainApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            await loadAllData();
        }

        async function loadAllData() {
            const [t, d, m, r, b, e, i] = await Promise.all([
                db.from('app_trips').select('*').eq('is_deleted', false).order('created_at', {ascending:false}),
                db.from('app_draws').select('*').eq('is_deleted', false).order('created_at', {ascending:false}),
                db.from('app_maintenance').select('*').eq('is_deleted', false).order('created_at', {ascending:false}),
                db.from('app_rentals').select('*').eq('is_deleted', false).order('created_at', {ascending:false}),
                db.from('app_debts').select('*').eq('is_deleted', false).order('created_at', {ascending:false}),
                db.from('app_expenses').select('*').eq('is_deleted', false).order('created_at', {ascending:false}),
                db.from('app_invoices').select('*').eq('is_deleted', false).order('created_at', {ascending:false})
            ]);

            store.trips = t.data || [];
            store.draws = d.data || [];
            store.maintenance = m.data || [];
            store.rentals = r.data || [];
            store.debts = b.data || [];
            store.expenses = e.data || [];
            store.invoices = i.data || [];

            renderCurrentTab();
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-blue-500', 'text-blue-400');
                btn.classList.add('border-transparent', 'text-slate-400');
            });
            document.getElementById(`tab-${tab}`).classList.add('border-blue-500', 'text-blue-400');
            renderCurrentTab();
        }

        function renderCurrentTab() {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            const query = document.getElementById('search-query').value.toLowerCase();
            const monthVal = document.getElementById('filter-month').value;

            let data = store[activeTab] || [];
            if (query) data = data.filter(i => JSON.stringify(i).toLowerCase().includes(query));
            if (monthVal) data = data.filter(i => i.date && i.date.startsWith(monthVal));

            tbody.innerHTML = '';

            if (activeTab === 'trips') {
                thead.innerHTML = `<tr><th class="p-3">التاريخ</th><th class="p-3">السائق</th><th class="p-3">التابعة لها</th><th class="p-3">المنقول لها</th><th class="p-3">السعر</th><th class="p-3">من والى</th><th class="p-3">ملاحظات</th><th class="p-3 no-print">إجراءات</th></tr>`;
                data.forEach(item => {
                    tbody.innerHTML += `<tr class="hover:bg-slate-800/50"><td class="p-3">${item.date||'-'}</td><td class="p-3 font-bold text-white">${item.driver_name||'-'}</td><td class="p-3">${item.company_name||'-'}</td><td class="p-3 text-blue-400">${item.client_name||'-'}</td><td class="p-3 font-bold text-emerald-400">${Number(item.amount||0).toLocaleString()}</td><td class="p-3 text-slate-400">${item.route_from||'-'} ⬅️ ${item.route_to||'-'}</td><td class="p-3 text-slate-400">${item.notes||'-'}</td><td class="p-3 no-print"><button onclick="softDelete('app_trips', '${item.id}')" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-trash"></i></button></td></tr>`;
                });
            } else if (activeTab === 'draws') {
                thead.innerHTML = `<tr><th class="p-3">التاريخ</th><th class="p-3">الشركة</th><th class="p-3">الاسم</th><th class="p-3">النوع</th><th class="p-3">نوع السحبية</th><th class="p-3">المبلغ</th><th class="p-3">ملاحظات</th><th class="p-3 no-print">إجراءات</th></tr>`;
                data.forEach(item => {
                    tbody.innerHTML += `<tr class="hover:bg-slate-800/50"><td class="p-3">${item.date||'-'}</td><td class="p-3">${item.company_name||'-'}</td><td class="p-3 font-bold text-white">${item.person_name||'-'}</td><td class="p-3 text-amber-400">${item.person_type||'-'}</td><td class="p-3">${item.draw_type||'-'}</td><td class="p-3 font-bold text-amber-400">${Number(item.amount||0).toLocaleString()}</td><td class="p-3 text-slate-400">${item.notes||'-'}</td><td class="p-3 no-print"><button onclick="softDelete('app_draws', '${item.id}')" class="text-rose-400"><i class="fa-solid fa-trash"></i></button></td></tr>`;
                });
            } else {
                thead.innerHTML = `<tr><th class="p-3">التاريخ</th><th class="p-3">البيان / الاسم</th><th class="p-3">المبلغ</th><th class="p-3">ملاحظات</th><th class="p-3 no-print">إجراءات</th></tr>`;
                data.forEach(item => {
                    let title = item.service_type || item.owner_name || item.person_name || item.expense_type || item.invoice_number || '-';
                    tbody.innerHTML += `<tr class="hover:bg-slate-800/50"><td class="p-3">${item.date||'-'}</td><td class="p-3 font-bold text-white">${title}</td><td class="p-3 font-bold text-emerald-400">${Number(item.amount||0).toLocaleString()}</td><td class="p-3 text-slate-400">${item.notes||'-'}</td><td class="p-3 no-print"><button onclick="softDelete('app_${activeTab}', '${item.id}')" class="text-rose-400"><i class="fa-solid fa-trash"></i></button></td></tr>`;
                });
            }
        }

        function buildDynamicFormFields(targetTable) {
            const container = document.getElementById('dynamic-fields-container');
            const today = new Date().toISOString().split('T')[0];

            if (targetTable === 'trips') {
                container.innerHTML = `
                    <input type="date" id="f-date" value="${today}" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="text" id="f-driver" placeholder="اسم السائق" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="text" id="f-company" placeholder="الشركة التابع لها" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="text" id="f-client" placeholder="الشركة المنقول لها" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="number" step="0.01" id="f-amount" placeholder="سعر الرحلة" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="f-from" placeholder="من وين" class="bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                        <input type="text" id="f-to" placeholder="إلى" class="bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    </div>
                    <textarea id="f-notes" placeholder="ملاحظات" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white"></textarea>
                `;
            } else if (targetTable === 'draws') {
                container.innerHTML = `
                    <input type="date" id="f-date" value="${today}" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="text" id="f-company" placeholder="الشركة" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="text" id="f-person" placeholder="الاسم" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="text" id="f-person-type" placeholder="النوع (سائق / عامل)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="text" id="f-draw-type" placeholder="نوع السحبية (من الراتب / مصاريف)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="number" step="0.01" id="f-amount" placeholder="المبلغ" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <textarea id="f-notes" placeholder="ملاحظات" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white"></textarea>
                `;
            } else {
                container.innerHTML = `
                    <input type="date" id="f-date" value="${today}" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="text" id="f-title" placeholder="البيان / الاسم / العنوان" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="number" step="0.01" id="f-amount" placeholder="المبلغ" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <textarea id="f-notes" placeholder="ملاحظات" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white"></textarea>
                `;
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const targetTable = document.getElementById('form-target-table').value;
            let dbTable = `app_${targetTable}`;
            let payload = {};

            if (targetTable === 'trips') {
                payload = {
                    date: document.getElementById('f-date').value,
                    driver_name: document.getElementById('f-driver').value,
                    company_name: document.getElementById('f-company').value,
                    client_name: document.getElementById('f-client').value,
                    amount: parseFloat(document.getElementById('f-amount').value||0),
                    route_from: document.getElementById('f-from').value,
                    route_to: document.getElementById('f-to').value,
                    notes: document.getElementById('f-notes').value
                };
            } else if (targetTable === 'draws') {
                payload = {
                    date: document.getElementById('f-date').value,
                    company_name: document.getElementById('f-company').value,
                    person_name: document.getElementById('f-person').value,
                    person_type: document.getElementById('f-person-type').value,
                    draw_type: document.getElementById('f-draw-type').value,
                    amount: parseFloat(document.getElementById('f-amount').value||0),
                    notes: document.getElementById('f-notes').value
                };
            } else {
                let titleVal = document.getElementById('f-title').value;
                payload = {
                    date: document.getElementById('f-date').value,
                    amount: parseFloat(document.getElementById('f-amount').value||0),
                    notes: document.getElementById('f-notes').value
                };
                if(targetTable === 'maintenance') payload.service_type = titleVal;
                if(targetTable === 'rentals') payload.owner_name = titleVal;
                if(targetTable === 'debts') payload.person_name = titleVal;
                if(targetTable === 'expenses') payload.expense_type = titleVal;
                if(targetTable === 'invoices') payload.invoice_number = titleVal;
            }

            const { error } = await db.from(dbTable).insert([payload]);
            if (error) alert('خطأ أثناء الحفظ: ' + error.message);
            else {
                closeModal('modal-add-entry');
                await loadAllData();
            }
        }

        async function softDelete(table, id) {
            if (confirm('هل أنت متأكد من الحذف؟ يمكنك استرجاعه لاحقاً من سلة المهملات.')) {
                await db.from(table).update({ is_deleted: true }).eq('id', id);
                await loadAllData();
            }
        }

        async function openTrashModal() {
            const list = document.getElementById('trash-list');
            list.innerHTML = 'جاري التحميل...';
            openModal('modal-trash');

            const [t, d] = await Promise.all([
                db.from('app_trips').select('*').eq('is_deleted', true),
                db.from('app_draws').select('*').eq('is_deleted', true)
            ]);

            list.innerHTML = '';
            const allTrash = [...(t.data||[]).map(x=>({...x, t:'app_trips'})), ...(d.data||[]).map(x=>({...x, t:'app_draws'}))];
            if(!allTrash.length) { list.innerHTML = '<p class="text-slate-500 text-center">لا توجد محذوفات</p>'; return; }

            allTrash.forEach(item => {
                list.innerHTML += `<div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center border border-slate-700"><div><span class="text-white font-bold">${item.driver_name || item.person_name || 'سجل'}</span><span class="text-slate-400 mr-2">(${item.amount} SAR)</span></div><button onclick="restoreRecord('${item.t}', '${item.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded-lg text-xs font-bold"><i class="fa-solid fa-rotate-left"></i> استرجاع</button></div>`;
            });
        }

        async function restoreRecord(table, id) {
            await db.from(table).update({ is_deleted: false }).eq('id', id);
            closeModal('modal-trash');
            await loadAllData();
        }

        function shareWhatsApp() {
            const text = `تقرير منظومة الحسابات والعمليات اللوجستية النشطة.`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function exportToExcel() {
            const wb = XLSX.utils.table_to_book(document.getElementById('data-table'), { sheet: activeTab });
            XLSX.writeFile(wb, `تقرير_${activeTab}.xlsx`);
        }

        function resetFilters() {
            document.getElementById('search-query').value = '';
            document.getElementById('filter-month').value = '';
            renderCurrentTab();
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
