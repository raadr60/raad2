<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة اللوجستيات والحسابات المتقدم</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans p-3 md:p-6 text-slate-800">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- الهيدر الرئيسي -->
        <header class="bg-slate-900 text-white p-5 rounded-2xl shadow-md flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">نظام الإدارة المالية والتشغيلية الموحد</h1>
                <p class="text-xs text-slate-400 mt-1">مُهيأ للتعامل مع ملايين الرحلات والعمليات بدقة متناهية</p>
            </div>
            <div class="flex items-center gap-2">
                <span id="connection-status" class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs px-3 py-1.5 rounded-full font-medium">جاري الاتصال بـ Supabase...</span>
            </div>
        </header>

        <!-- كروت الإحصائيات المالية المباشرة -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-500">إجمالي الإيرادات (النولون)</p>
                <h3 id="stat-income" class="text-xl md:text-2xl font-bold text-emerald-600 mt-1">0.00</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-500">إجمالي سحبيات السائقين</p>
                <h3 id="stat-draws" class="text-xl md:text-2xl font-bold text-amber-600 mt-1">0.00</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-500">مصاريف الصيانة والتشغيل</p>
                <h3 id="stat-expenses" class="text-xl md:text-2xl font-bold text-rose-600 mt-1">0.00</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-500">صافي الأرباح</p>
                <h3 id="stat-profit" class="text-xl md:text-2xl font-bold text-blue-600 mt-1">0.00</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 col-span-2 md:col-span-1">
                <p class="text-xs font-semibold text-slate-500">عدد الرحلات المنجزة</p>
                <h3 id="stat-trips" class="text-xl md:text-2xl font-bold text-indigo-600 mt-1">0</h3>
            </div>
        </div>

        <!-- شريط الفلاتر السريعة والبحث الذكي -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-base font-bold text-slate-800">الفلاتر والتحليل الشهري</h2>
                <button onclick="resetFilters()" class="text-xs text-blue-600 hover:underline">إعادة تعيين الفلاتر</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                
                <!-- فلتر الشركات -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">تصفية حسب الشركة</label>
                    <select id="filter-company" class="w-full border rounded-lg p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">جميع الشركات</option>
                    </select>
                </div>

                <!-- فلتر السائقين -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">تصفية حسب السائق</label>
                    <select id="filter-driver" class="w-full border rounded-lg p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">جميع السائقين</option>
                    </select>
                </div>

                <!-- فلتر الشهر والسنة -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">تحديد الشهر / السنة</label>
                    <input type="month" id="filter-month" class="w-full border rounded-lg p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- البحث الشامل -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">البحث المباشر</label>
                    <input type="text" id="filter-search" placeholder="رقم الرحلة، البوليسة..." class="w-full border rounded-lg p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

            </div>
        </div>

        <!-- التبويبات للتنقل بين أجزاء النظام -->
        <div class="flex border-b border-slate-300 gap-2 overflow-x-auto text-sm font-medium">
            <button onclick="switchTab('trips')" id="tab-trips" class="tab-btn px-4 py-2 border-b-2 border-blue-600 text-blue-600 font-bold whitespace-nowrap">الرحلات والنولون</button>
            <button onclick="switchTab('draws')" id="tab-draws" class="tab-btn px-4 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap">سحبيات السائقين</button>
            <button onclick="switchTab('maintenance')" id="tab-maintenance" class="tab-btn px-4 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap">الصيانة والمصاريف</button>
            <button onclick="switchTab('debts')" id="tab-debts" class="tab-btn px-4 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap">الديون والالتزامات</button>
        </div>

        <!-- محتوى عرض البيانات -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead id="table-head" class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase">
                        <!-- يتم تغييره عبر JS -->
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100 text-sm text-slate-700">
                        <!-- جلب البيانات -->
                    </tbody>
                </table>
            </div>

            <!-- التنقل بين الصفحات -->
            <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center text-xs md:text-sm">
                <button id="btn-prev" onclick="changePage(-1)" class="px-4 py-2 border rounded-lg bg-white shadow-sm disabled:opacity-50 font-medium">السابق</button>
                <span id="page-indicator" class="text-slate-600 font-medium">الصفحة 1</span>
                <button id="btn-next" onclick="changePage(1)" class="px-4 py-2 border rounded-lg bg-white shadow-sm disabled:opacity-50 font-medium">التالي</button>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // الربط المباشر بقاعدة بيانات Supabase
        // ==========================================
        const SUPABASE_URL = 'https://fdvewnybywmxmbjmnlgt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Xr6Qm3QS7h8K-5P9dLjDUQ_uHF4CTgD';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentTab = 'trips';
        let currentPage = 1;
        const pageSize = 50;

        document.addEventListener('DOMContentLoaded', async () => {
            checkConnection();
            await loadDropdowns();
            await refreshView();

            document.getElementById('filter-company').addEventListener('change', () => { currentPage = 1; refreshView(); });
            document.getElementById('filter-driver').addEventListener('change', () => { currentPage = 1; refreshView(); });
            document.getElementById('filter-month').addEventListener('change', () => { currentPage = 1; refreshView(); });
            document.getElementById('filter-search').addEventListener('input', debounce(() => { currentPage = 1; refreshView(); }, 300));
        });

        async function checkConnection() {
            const statusEl = document.getElementById('connection-status');
            try {
                const { error } = await db.from('companies').select('id').limit(1);
                if (!error) {
                    statusEl.textContent = 'متصل بـ Supabase بنجاح';
                    statusEl.className = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1.5 rounded-full font-medium';
                } else {
                    throw error;
                }
            } catch (err) {
                statusEl.textContent = 'خطأ في الاتصال';
                statusEl.className = 'bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs px-3 py-1.5 rounded-full font-medium';
            }
        }

        async function loadDropdowns() {
            const { data: companies } = await db.from('companies').select('id, name');
            const { data: drivers } = await db.from('drivers').select('id, name');

            const compSelect = document.getElementById('filter-company');
            companies?.forEach(c => compSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`);

            const driverSelect = document.getElementById('filter-driver');
            drivers?.forEach(d => driverSelect.innerHTML += `<option value="${d.id}">${d.name}</option>`);
        }

        async function refreshView() {
            await fetchFinancialSummary();
            await fetchTableData();
        }

        async function fetchFinancialSummary() {
            const companyId = document.getElementById('filter-company').value || null;
            const driverId = document.getElementById('filter-driver').value || null;
            const monthVal = document.getElementById('filter-month').value;

            let startDate = null, endDate = null;
            if (monthVal) {
                const [year, month] = monthVal.split('-');
                startDate = `${year}-${month}-01`;
                endDate = new Date(year, month, 0).toISOString().split('T')[0];
            }

            const { data } = await db.rpc('get_full_financial_summary', {
                p_company_id: companyId,
                p_driver_id: driverId,
                p_start_date: startDate,
                p_end_date: endDate
            });

            if (data && data.length > 0) {
                const s = data[0];
                document.getElementById('stat-income').textContent = Number(s.total_income).toLocaleString('ar-SA', {minimumFractionDigits:2});
                document.getElementById('stat-draws').textContent = Number(s.total_draws).toLocaleString('ar-SA', {minimumFractionDigits:2});
                document.getElementById('stat-expenses').textContent = Number(s.total_expenses).toLocaleString('ar-SA', {minimumFractionDigits:2});
                document.getElementById('stat-profit').textContent = Number(s.net_profit).toLocaleString('ar-SA', {minimumFractionDigits:2});
                document.getElementById('stat-trips').textContent = s.total_trips;
            }
        }

        async function fetchTableData() {
            const companyId = document.getElementById('filter-company').value || null;
            const driverId = document.getElementById('filter-driver').value || null;
            const monthVal = document.getElementById('filter-month').value;
            const searchVal = document.getElementById('filter-search').value.trim();

            let startDate = null, endDate = null;
            if (monthVal) {
                const [year, month] = monthVal.split('-');
                startDate = `${year}-${month}-01`;
                endDate = new Date(year, month, 0).toISOString().split('T')[0];
            }

            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-6 text-slate-400">جاري جلب البيانات...</td></tr>';

            const from = (currentPage - 1) * pageSize;
            const to = from + pageSize - 1;

            if (currentTab === 'trips') {
                thead.innerHTML = `
                    <tr>
                        <th class="p-3">رقم الرحلة</th>
                        <th class="p-3">التاريخ</th>
                        <th class="p-3">الشركة</th>
                        <th class="p-3">السائق</th>
                        <th class="p-3">النولون (المدخول)</th>
                        <th class="p-3">رقم البوليسة</th>
                        <th class="p-3">المسار</th>
                    </tr>
                `;

                let q = db.from('trips').select('*, companies(name), drivers(name)', { count: 'exact' });
                if (companyId) q = q.eq('company_id', companyId);
                if (driverId) q = q.eq('driver_id', driverId);
                if (startDate && endDate) q = q.gte('trip_date', startDate).lte('trip_date', endDate);
                if (searchVal) q = q.or(`trip_number.ilike.%${searchVal}%,waybill_number.ilike.%${searchVal}%`);

                const { data, count } = await q.order('trip_date', { ascending: false }).range(from, to);
                renderTrips(data);
                updatePagination(count);

            } else if (currentTab === 'draws') {
                thead.innerHTML = `
                    <tr>
                        <th class="p-3">التاريخ</th>
                        <th class="p-3">السائق</th>
                        <th class="p-3">الشركة</th>
                        <th class="p-3">المبلغ (المخروج)</th>
                        <th class="p-3">السبب / البيان</th>
                    </tr>
                `;

                let q = db.from('driver_draws').select('*, companies(name), drivers(name)', { count: 'exact' });
                if (companyId) q = q.eq('company_id', companyId);
                if (driverId) q = q.eq('driver_id', driverId);
                if (startDate && endDate) q = q.gte('draw_date', startDate).lte('draw_date', endDate);
                if (searchVal) q = q.ilike('reason', `%${searchVal}%`);

                const { data, count } = await q.order('draw_date', { ascending: false }).range(from, to);
                renderDraws(data);
                updatePagination(count);

            } else if (currentTab === 'maintenance') {
                thead.innerHTML = `
                    <tr>
                        <th class="p-3">التاريخ</th>
                        <th class="p-3">الشركة</th>
                        <th class="p-3">الشاحنة / الدينا</th>
                        <th class="p-3">نوع المصروف</th>
                        <th class="p-3">المبلغ</th>
                        <th class="p-3">التفاصيل</th>
                    </tr>
                `;

                let q = db.from('maintenance_and_expenses').select('*, companies(name), trucks(plate_number)', { count: 'exact' });
                if (companyId) q = q.eq('company_id', companyId);
                if (startDate && endDate) q = q.gte('expense_date', startDate).lte('expense_date', endDate);
                if (searchVal) q = q.ilike('description', `%${searchVal}%`);

                const { data, count } = await q.order('expense_date', { ascending: false }).range(from, to);
                renderMaintenance(data);
                updatePagination(count);

            } else if (currentTab === 'debts') {
                thead.innerHTML = `
                    <tr>
                        <th class="p-3">التاريخ</th>
                        <th class="p-3">الشركة</th>
                        <th class="p-3">الجهة / الشخص</th>
                        <th class="p-3">النوع</th>
                        <th class="p-3">المبلغ الإجمالي</th>
                        <th class="p-3">المدفوع</th>
                        <th class="p-3">الحالة</th>
                    </tr>
                `;

                let q = db.from('debts').select('*, companies(name)', { count: 'exact' });
                if (companyId) q = q.eq('company_id', companyId);
                if (searchVal) q = q.ilike('entity_name', `%${searchVal}%`);

                const { data, count } = await q.order('debt_date', { ascending: false }).range(from, to);
                renderDebts(data);
                updatePagination(count);
            }
        }

        function renderTrips(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">لا توجد رحلات مطابقة</td></tr>'; return; }
            data.forEach(t => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 font-bold text-slate-800">${t.trip_number || '-'}</td>
                        <td class="p-3">${t.trip_date}</td>
                        <td class="p-3">${t.companies?.name || '-'}</td>
                        <td class="p-3">${t.drivers?.name || '-'}</td>
                        <td class="p-3 font-semibold text-emerald-600">${Number(t.income_amount).toFixed(2)}</td>
                        <td class="p-3">${t.waybill_number || '-'}</td>
                        <td class="p-3 text-xs text-slate-500">${t.origin || '-'} ⬅️ ${t.destination || '-'}</td>
                    </tr>
                `;
            });
        }

        function renderDraws(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4">لا توجد سحبيات مطابقة</td></tr>'; return; }
            data.forEach(d => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3">${d.draw_date}</td>
                        <td class="p-3 font-semibold">${d.drivers?.name || '-'}</td>
                        <td class="p-3">${d.companies?.name || '-'}</td>
                        <td class="p-3 font-semibold text-amber-600">${Number(d.amount).toFixed(2)}</td>
                        <td class="p-3 text-xs text-slate-600">${d.reason || '-'}</td>
                    </tr>
                `;
            });
        }

        function renderMaintenance(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4">لا توجد مصاريف صيانة مطابقة</td></tr>'; return; }
            data.forEach(m => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3">${m.expense_date}</td>
                        <td class="p-3">${m.companies?.name || '-'}</td>
                        <td class="p-3 font-semibold">${m.trucks?.plate_number || '-'}</td>
                        <td class="p-3"><span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-xs">${m.expense_type || 'صيانة'}</span></td>
                        <td class="p-3 font-semibold text-rose-600">${Number(m.amount).toFixed(2)}</td>
                        <td class="p-3 text-xs text-slate-600">${m.description || '-'}</td>
                    </tr>
                `;
            });
        }

        function renderDebts(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">لا توجد ديون مطابقة</td></tr>'; return; }
            data.forEach(d => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3">${d.debt_date}</td>
                        <td class="p-3">${d.companies?.name || '-'}</td>
                        <td class="p-3 font-semibold">${d.entity_name}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded text-xs ${d.debt_type === 'علينا' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">${d.debt_type}</span></td>
                        <td class="p-3 font-semibold">${Number(d.amount).toFixed(2)}</td>
                        <td class="p-3 text-emerald-600">${Number(d.paid_amount).toFixed(2)}</td>
                        <td class="p-3 text-xs font-semibold">${d.status}</td>
                    </tr>
                `;
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            currentPage = 1;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-blue-600', 'text-blue-600', 'font-bold');
                btn.classList.add('border-transparent', 'text-slate-500');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.remove('border-transparent', 'text-slate-500');
            activeBtn.classList.add('border-blue-600', 'text-blue-600', 'font-bold');
            fetchTableData();
        }

        function updatePagination(totalCount) {
            const maxPages = Math.ceil((totalCount || 1) / pageSize);
            document.getElementById('page-indicator').textContent = `الصفحة ${currentPage} من ${maxPages}`;
            document.getElementById('btn-prev').disabled = currentPage === 1;
            document.getElementById('btn-next').disabled = (currentPage * pageSize) >= (totalCount || 0);
        }

        function changePage(direction) {
            currentPage += direction;
            fetchTableData();
        }

        function resetFilters() {
            document.getElementById('filter-company').value = '';
            document.getElementById('filter-driver').value = '';
            document.getElementById('filter-month').value = '';
            document.getElementById('filter-search').value = '';
            currentPage = 1;
            refreshView();
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    </script>
</body>
</html>
